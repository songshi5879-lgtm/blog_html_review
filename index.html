<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>HTML Review · 文章审稿台</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --line:#e5e7eb; --line2:#eef0f3; --text:#1f2937; --muted:#6b7280; --faint:#9ca3af;
  --accent:#0f766e; --accent-soft:#e6f4f2; --accent-ink:#0b5f58; --warn:#b45309; --warn-soft:#fff7e6; --danger:#b91c1c; --danger-soft:#fdecec;
  --info:#1d4ed8; --info-soft:#eaf1ff; --hl:#ffd54a; --radius:10px; --shadow:0 8px 30px rgba(15,23,42,.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Roboto, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-size:14px}
button{font:inherit;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.hidden{display:none !important}

/* header */
header{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:15px;white-space:nowrap}
.brand-mark{width:26px;height:26px;border-radius:7px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700}
.brand small{font-weight:400;color:var(--muted);font-size:12px}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;color:var(--text);display:inline-flex;align-items:center;gap:6px;white-space:nowrap;line-height:1.3}
.btn:hover{background:#f3f4f6}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:#f3c4c4}
.btn.danger:hover{background:var(--danger-soft)}
.btn.solid-danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:#f3f4f6;color:var(--text)}
.btn.sm{padding:3px 8px;font-size:12.5px;border-radius:6px}
.btn.on{background:var(--info-soft);border-color:#bcd0fb;color:var(--info)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* layout */
#app{display:grid;grid-template-columns:290px minmax(0,1fr) 360px;height:calc(100vh - 52px)}
aside#sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.search{padding:12px;border-bottom:1px solid var(--line2)}
.search input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fafafa;outline:none}
.search input:focus{border-color:var(--accent);background:#fff}
#doclist{overflow:auto;flex:1;padding:6px 0 20px}
.batch{margin:4px 0}
.batch-h{display:flex;align-items:center;gap:6px;padding:8px 12px 6px;color:var(--muted);font-size:12px;cursor:pointer;user-select:none}
.batch-h .chev{width:12px;transition:transform .15s;display:inline-block}
.batch.collapsed .chev{transform:rotate(-90deg)}
.batch.collapsed .batch-items{display:none}
.batch-h .bname{font-weight:600;color:#374151;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.batch-h .bact{margin-left:auto;display:flex;gap:2px;opacity:0;transition:opacity .15s}
.batch-h:hover .bact{opacity:1}
.icon-btn{border:none;background:transparent;color:var(--faint);padding:2px 5px;border-radius:5px;font-size:12px}
.icon-btn:hover{background:#eef0f3;color:var(--text)}
.doc-item{display:flex;align-items:center;gap:8px;padding:7px 12px 7px 28px;cursor:pointer;border-left:3px solid transparent}
.doc-item:hover{background:#f7f8fa}
.doc-item.active{background:var(--accent-soft);border-left-color:var(--accent)}
.doc-item .dname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-item .dact{opacity:0}
.doc-item:hover .dact{opacity:1}
.pill{font-size:11px;padding:1px 6px;border-radius:999px;background:#eef0f3;color:var(--muted);white-space:nowrap}
.pill.open{background:#fff1d6;color:var(--warn)}
.pill.ver{background:var(--info-soft);color:var(--info)}
.pill.miss{background:var(--danger-soft);color:var(--danger)}
.side-empty{padding:28px 18px;color:var(--muted);line-height:1.6}

main#center{display:flex;flex-direction:column;min-width:0;min-height:0}
.toolbar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.toolbar .title{font-weight:650;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:420px}
.toolbar .sub{color:var(--muted);font-size:12px;white-space:nowrap}
.toolbar select{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:#fff}
.bar{padding:8px 14px;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.bar.warn{background:var(--warn-soft);color:#7c4a03}
.bar.info{background:var(--info-soft);color:#1e3a8a}
.bar.danger{background:var(--danger-soft);color:#7f1d1d}
.frame-wrap{flex:1;min-height:0;padding:16px;overflow:hidden}
.frame-card{height:100%;background:#fff;border-radius:var(--radius);box-shadow:0 1px 3px rgba(0,0,0,.06),0 0 0 1px var(--line);overflow:hidden}
iframe#preview{width:100%;height:100%;border:0;display:block;background:#fff}
.center-empty{flex:1;display:grid;place-items:center;color:var(--muted);text-align:center;padding:40px;line-height:1.7}
.center-empty .big{font-size:40px;margin-bottom:6px}

section#panel{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.panel-h{padding:12px 14px 10px;border-bottom:1px solid var(--line2)}
.panel-h .row{display:flex;align-items:center;gap:8px}
.panel-h h3{margin:0;font-size:14px}
.tabs{display:flex;gap:4px;margin-top:10px}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:12.5px;color:var(--muted)}
.tab.active{background:var(--text);border-color:var(--text);color:#fff}
.hint{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.5}
#threads{flex:1;overflow:auto;padding:10px 12px 40px}
.thread{border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:10px;background:#fff;transition:box-shadow .15s,border-color .15s;cursor:pointer}
.thread:hover{border-color:#cfd4dc}
.thread.active{border-color:#f0b400;box-shadow:0 0 0 3px rgba(255,200,0,.25)}
.thread.resolved{background:#fafafa}
.thread.resolved .quote{opacity:.6}
.quote{font-size:12.5px;color:#4b5563;border-left:3px solid var(--hl);padding:2px 8px;margin-bottom:8px;background:#fffbea;border-radius:0 6px 6px 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.cmt{position:relative}
.cmt + .cmt{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.meta{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.meta b{color:var(--text);font-weight:600;font-size:12.5px}
.tag{font-size:10.5px;padding:0 5px;border-radius:4px;background:#eef0f3;color:var(--muted)}
.tag.admin{background:var(--accent-soft);color:var(--accent-ink)}
.tag.res{background:#e7f6ec;color:#15803d}
.tag.carry{background:var(--info-soft);color:var(--info)}
.body{margin-top:4px;white-space:pre-wrap;word-break:break-word;line-height:1.55}
.body.deleted{color:var(--faint);font-style:italic}
.actions{display:flex;gap:2px;margin-top:6px;flex-wrap:wrap}
.actions .btn{padding:2px 7px;font-size:12px;border:none;color:var(--muted);background:transparent}
.actions .btn:hover{background:#f1f3f5;color:var(--text)}
textarea.ta{width:100%;min-height:72px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical;outline:none;line-height:1.5}
textarea.ta:focus,input.inp:focus{border-color:var(--accent)}
input.inp{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 10px;outline:none}
.composer{border:1px solid #f0d27a;background:#fffdf5;border-radius:var(--radius);padding:10px 12px;margin-bottom:12px}
.composer .row{display:flex;gap:6px;justify-content:flex-end;margin-top:8px;align-items:center}
.composer .row .k{margin-right:auto;font-size:11.5px;color:var(--faint)}
.empty-c{color:var(--muted);text-align:center;padding:30px 10px;line-height:1.7}
.orphans{margin-top:16px}
.orphans summary{cursor:pointer;color:var(--muted);font-size:12.5px;padding:6px 0}

/* floating comment button */
#floatBtn{position:fixed;z-index:30;background:var(--text);color:#fff;border:none;border-radius:999px;padding:7px 14px;box-shadow:var(--shadow);font-size:13px;display:flex;gap:6px;align-items:center}
#floatBtn:hover{background:#000}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.35);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:#fff;border-radius:14px;box-shadow:var(--shadow);width:min(560px,100%);max-height:90vh;display:flex;flex-direction:column}
.modal.wide{width:min(820px,100%)}
.modal-h{padding:16px 20px 8px;font-weight:650;font-size:16px}
.modal-b{padding:6px 20px 12px;overflow:auto;line-height:1.6}
.modal-f{padding:12px 20px 16px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--line2)}
.field{margin:10px 0}
.field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:4px}
.drop{border:2px dashed #cfd4dc;border-radius:12px;padding:26px;text-align:center;color:var(--muted);background:#fafbfc;transition:all .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.drop .btns{display:flex;gap:8px;justify-content:center;margin-top:12px}
table.files{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:12px}
table.files th,table.files td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line2)}
table.files th{color:var(--muted);font-weight:500}
.ok{color:#15803d}.bad{color:var(--danger)}.mut{color:var(--muted)}
.progress{height:6px;background:#eef0f3;border-radius:99px;overflow:hidden;margin-top:12px}
.progress > div{height:100%;background:var(--accent);width:0;transition:width .2s}
.img-prev{max-width:100%;max-height:200px;display:block;margin:6px 0;border-radius:8px;border:1px solid var(--line);background:#fafafa}
.or{color:var(--faint);font-size:12px;text-align:center;margin:6px 0}

#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;z-index:99;box-shadow:var(--shadow);max-width:80vw}
#toast.err{background:var(--danger)}
.setup{max-width:640px;margin:60px auto;background:#fff;border-radius:14px;box-shadow:var(--shadow);padding:28px 32px;line-height:1.7}
.setup code{background:#f3f4f6;padding:1px 5px;border-radius:4px}
.lang{font-size:12px}

@media (max-width:1100px){ #app{grid-template-columns:230px minmax(0,1fr) 300px} }
@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 60vh auto;height:auto}
  aside#sidebar{max-height:220px}
  section#panel{min-height:300px}
  .brand small{display:none}
}
</style>
</head>

  <div class="brand"><div class="brand-mark">R</div><span id="brandTitle"></span><small id="brandSub"></small></div>
  <div class="spacer"></div>
  <button class="btn ghost lang" id="langBtn"></button>
  <span id="adminBtns" class="hidden" style="display:flex;gap:8px">
    <button class="btn primary" id="uploadBtn"></button>
    <button class="btn danger" id="clearBtn"></button>
    <button class="btn ghost" id="logoutBtn"></button>
  </span>
  <button class="btn ghost" id="loginBtn"></button>
</header>
<div id="app">
  <aside id="sidebar">
    <div class="search"><input id="search" type="search"></div>

</div>
<button id="floatBtn" class="hidden"></button>

/* ============================================================ backend: Supabase */
function supabaseApi(sb){
  const must = r => { if (r.error) throw r.error; return r.data; };
  const bucket = () => sb.storage.from('images');
  async function listAll(prefix){
    const out = [];
    async function walk(p){
      for (let offset = 0; ; offset += 1000) {
        const data = must(await bucket().list(p, { limit:1000, offset }));
        for (const it of data) {
          const full = p ? `${p}/${it.name}` : it.name;
          if (it.id === null || it.id === undefined) await walk(full); else out.push(full);
        }
        if (data.length < 1000) break;
      }
    }
    await walk(prefix); return out;
  }
  async function removePrefix(prefix){
    const paths = await listAll(prefix);
    for (let i = 0; i < paths.length; i += 500) must(await bucket().remove(paths.slice(i, i + 500)));
  }
  return {
    demo:false,
    async isAdmin(){ const { data: s } = await sb.auth.getSession(); if (!s.session) return false; const r = await sb.rpc('is_admin'); return !r.error && r.data === true; },
    async signIn(email, password){ must(await sb.auth.signInWithPassword({ email, password })); },
    async signOut(){ await sb.auth.signOut(); },
    async listBatches(){ return must(await sb.from('batches').select('*').order('created_at', { ascending:false })); },
    async listDocs(){ return must(await sb.from('docs').select('id,batch_id,name,current_version,missing_images,created_at,updated_at')); },
    async commentStats(){ return must(await sb.from('comments').select('id,doc_id,parent_id,resolved')); },
    async listVersions(docId){ return must(await sb.from('versions').select('id,version,note,created_at').eq('doc_id', docId).order('version', { ascending:false })); },
    async getHtml(docId, version){ return must(await sb.from('versions').select('html').eq('doc_id', docId).eq('version', version).single()).html; },
    async createBatch(name){ return must(await sb.from('batches').insert({ name }).select().single()); },
    async renameBatch(id, name){ must(await sb.from('batches').update({ name }).eq('id', id)); },
    async createDoc(row){ return must(await sb.from('docs').insert(row).select().single()); },
    async addVersion(docId, version, html, note, missing){
      must(await sb.from('versions').insert({ doc_id:docId, version, html, note }));
      must(await sb.from('docs').update({ current_version:version, missing_images:missing, updated_at:new Date().toISOString() }).eq('id', docId));
    },
    async deleteDoc(doc){ await removePrefix(`${doc.batch_id}/${doc.id}`).catch(console.warn); must(await sb.from('docs').delete().eq('id', doc.id)); },
    async deleteBatch(id){ await removePrefix(id).catch(console.warn); must(await sb.from('batches').delete().eq('id', id)); },
    async clearAll(){ await removePrefix('').catch(console.warn); must(await sb.from('batches').delete().not('id', 'is', null)); },
    async uploadImage(path, blob, type){ must(await bucket().upload(path, blob, { contentType:type, upsert:false, cacheControl:'31536000' })); return bucket().getPublicUrl(path).data.publicUrl; },
    async listComments(docId){ return must(await sb.from('comments').select('*').eq('doc_id', docId).order('created_at')); },
    async addComment(row){ return must(await sb.from('comments').insert(row).select().single()); },
    async adminUpdateComment(id, patch){ must(await sb.from('comments').update(patch).eq('id', id)); },
    async adminDeleteComment(id){ must(await sb.from('comments').delete().eq('id', id)); },
    async editMyComment(id, token, body){ must(await sb.rpc('edit_my_comment', { p_id:id, p_token:token, p_body:body })); },
    async deleteMyComment(id, token){ must(await sb.rpc('delete_my_comment', { p_id:id, p_token:token })); },
    subscribe(onChange){
      try {
        sb.channel('rv-changes')
          .on('postgres_changes', { event:'*', schema:'public', table:'comments' }, p => onChange('comments', p))
          .on('postgres_changes', { event:'*', schema:'public', table:'docs' }, p => onChange('docs', p))
          .on('postgres_changes', { event:'*', schema:'public', table:'batches' }, p => onChange('batches', p))
          .subscribe();
      } catch (e) { console.warn('realtime off', e); }
    },
  };
}

/* ============================================================ backend: local demo (localStorage) */
function demoApi(){
  const KEY = 'rv_demo_db';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; } };
  let db = load() || { batches:[], docs:[], versions:[], comments:[] };
  const persist = () => { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { console.warn('demo storage full', e); } };
  const now = () => new Date().toISOString();
  let admin = sessionStorage.getItem('rv_demo_admin') === '1';
  const clone = x => JSON.parse(JSON.stringify(x));
  return {
    demo:true,
    async isAdmin(){ return admin; },
    async signIn(email, pw){ if (!email || !pw) throw new Error('missing'); admin = true; sessionStorage.setItem('rv_demo_admin', '1'); },
    async signOut(){ admin = false; sessionStorage.removeItem('rv_demo_admin'); },
    async listBatches(){ return clone(db.batches).sort((a, b) => b.created_at.localeCompare(a.created_at)); },
    async listDocs(){ return clone(db.docs); },
    async commentStats(){ return db.comments.map(c => ({ id:c.id, doc_id:c.doc_id, parent_id:c.parent_id, resolved:c.resolved })); },
    async listVersions(docId){ return db.versions.filter(v => v.doc_id === docId).map(({ html, ...v }) => v).sort((a, b) => b.version - a.version); },
    async getHtml(docId, version){ return db.versions.find(v => v.doc_id === docId && v.version === version)?.html ?? ''; },
    async createBatch(name){ const b = { id:uid(), name, created_at:now() }; db.batches.push(b); persist(); return clone(b); },
    async renameBatch(id, name){ db.batches.find(b => b.id === id).name = name; persist(); },
    async createDoc(row){ const d = { id:uid(), current_version:1, missing_images:[], created_at:now(), updated_at:now(), ...row }; db.docs.push(d); persist(); return clone(d); },
    async addVersion(docId, version, html, note, missing){ db.versions.push({ id:uid(), doc_id:docId, version, html, note, created_at:now() }); Object.assign(db.docs.find(d => d.id === docId), { current_version:version, missing_images:missing, updated_at:now() }); persist(); },
    async deleteDoc(doc){ db.docs = db.docs.filter(d => d.id !== doc.id); db.versions = db.versions.filter(v => v.doc_id !== doc.id); db.comments = db.comments.filter(c => c.doc_id !== doc.id); persist(); },
    async deleteBatch(id){ const ids = db.docs.filter(d => d.batch_id === id).map(d => d.id); db.batches = db.batches.filter(b => b.id !== id); for (const d of ids) await this.deleteDoc({ id:d }); persist(); },
    async clearAll(){ db = { batches:[], docs:[], versions:[], comments:[] }; persist(); },
    async uploadImage(path, blob){ return await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(blob); }); },
    async listComments(docId){ return clone(db.comments.filter(c => c.doc_id === docId)).sort((a, b) => a.created_at.localeCompare(b.created_at)); },
    async addComment(row){ const c = { id:uid(), resolved:false, created_at:now(), updated_at:null, ...row }; db.comments.push(c); persist(); return clone(c); },
    async adminUpdateComment(id, patch){ Object.assign(db.comments.find(c => c.id === id), patch); persist(); },
    async adminDeleteComment(id){ const kill = new Set([id]); db.comments.forEach(c => { if (kill.has(c.parent_id)) kill.add(c.id); }); db.comments = db.comments.filter(c => !kill.has(c.id)); persist(); },
    async editMyComment(id, token, body){ const c = db.comments.find(c => c.id === id); if (c.token_hash !== await sha256hex(token)) throw new Error('not allowed'); c.body = body; c.updated_at = now(); persist(); },
    async deleteMyComment(id, token){ const c = db.comments.find(c => c.id === id); if (c.token_hash !== await sha256hex(token)) throw new Error('not allowed'); if (db.comments.some(x => x.parent_id === id)) { c.body = '-'; c.deleted = true; c.updated_at = now(); } else db.comments = db.comments.filter(x => x.id !== id); persist(); },
    subscribe(){},
  };
}

/* ============================================================ HTML processing */
const parseHtml = s => new DOMParser().parseFromString(s, 'text/html');
const isFragment = s => !/<html[\s>]/i.test(s) && !/<body[\s>]/i.test(s) && !/<!doctype/i.test(s);

const isLocalRef = u => !!u && !!u.trim() && !/^(https?:|data:|blob:|about:|mailto:|tel:|javascript:|#|\/\/)/i.test(u.trim());

function normRef(ref){
  let r = ref.trim().replace(/\\/g, '/').split('#')[0].split('?')[0];
  try { r = decodeURIComponent(r); } catch {}
  return r.replace(/^file:\/+/i, '').replace(/^[a-z]:\//i, '/');
}
function joinPath(dir, rel){
  const out = [];
  for (const p of (dir ? dir.split('/') : []).concat(rel.split('/'))) { if (!p || p === '.') continue; if (p === '..') out.pop(); else out.push(p); }
  return out.join('/').toLowerCase();
}
function makeImageIndex(items){ // items: [{file, path}]
  const byPath = new Map(), byBase = new Map();
  for (const it of items) {
    const p = it.path.replace(/^\/+/, '').toLowerCase();
    byPath.set(p, it.file);
    const b = baseName(p); if (!byBase.has(b)) byBase.set(b, it.file);
  }
  return { byPath, byBase, size:items.length };
}
function findImage(ref, htmlPath, idx){
  if (!idx || !idx.size) return null;
  const r = normRef(ref);
  const full = joinPath(dirName(htmlPath.replace(/^\/+/, '')), r);
  if (idx.byPath.has(full)) return idx.byPath.get(full);
  const clean = joinPath('', r);
  for (const [k, f] of idx.byPath) if (k === clean || k.endsWith('/' + clean)) return f;
  return idx.byBase.get(baseName(clean)) || null;
}
function srcsetUrls(v){ return (v || '').split(/,\s+/).map(s => s.trim().split(/\s+/)[0]).filter(Boolean); }
function collectRefs(doc){ // all image refs that may need rewriting
  const refs = [];
  doc.querySelectorAll('img,source,input[type=image],video[poster]').forEach(el => {
    for (const a of ['src', 'data-src', 'poster']) if (el.hasAttribute(a)) refs.push({ el, attr:a, kind:'url', value:el.getAttribute(a) });
    for (const a of ['srcset', 'data-srcset']) if (el.hasAttribute(a)) refs.push({ el, attr:a, kind:'srcset', value:el.getAttribute(a) });
  });
  doc.querySelectorAll('[style*="url("]').forEach(el => refs.push({ el, attr:'style', kind:'css', value:el.getAttribute('style') }));
  doc.querySelectorAll('style').forEach(el => { if (el.textContent.includes('url(')) refs.push({ el, attr:null, kind:'css', value:el.textContent }); });
  return refs;
}
const cssUrlRe = /url\(\s*(['"]?)([^'")]+)\1\s*\)/g;
function localRefNames(html){
  const doc = parseHtml(html), names = new Set();
  for (const r of collectRefs(doc)) {
    const urls = r.kind === 'url' ? [r.value] : r.kind === 'srcset' ? srcsetUrls(r.value) : [...r.value.matchAll(cssUrlRe)].map(m => m[2]);
    for (const u of urls) if (isLocalRef(u)) names.add(baseName(normRef(u)) || u);
  }
  return [...names];
}
function prescan(text, htmlPath, idx){
  const doc = parseHtml(text); let found = 0; const miss = new Set();

    const urls = r.kind === 'url' ? [r.value] : r.kind === 'srcset' ? srcsetUrls(r.value) : [...r.value.matchAll(cssUrlRe)].map(m => m[2]);
    for (const u of urls) if (isLocalRef(u)) { if (findImage(u, htmlPath, idx)) found++; else miss.add(baseName(normRef(u))); }
  }
  return { found, missing:[...miss] };
}

async function compressImage(file){
  const name = file.name || 'image', type = file.type || mimeOf(name);
  const keep = { blob:file, ext:extOf(name) || 'png', type };
  if (/gif|svg|icon/.test(type) || file.size < 80 * 1024) return keep;
  try {
    const bmp = await createImageBitmap(file);
    const s = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, 'image/webp', 0.82));
    if (blob && blob.size < file.size) return { blob, ext:'webp', type:'image/webp' };
  } catch (e) { console.warn('compress failed', e); }
  return keep;
}
async function uploadImageFile(file, folder){
  const { blob, ext, type } = await compressImage(file);
  return api.uploadImage(`${folder}/${uid()}.${ext}`, blob, type);
}
function dataUrlToBlob(u){
  const [head, b64] = u.split(','); const type = (head.match(/data:([^;]+)/) || [,'image/png'])[1];
  const bin = atob(b64); const arr = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
  return new File([arr], 'inline.' + (type.split('/')[1] || 'png').replace('+xml', ''), { type });
}
/** Replace local image refs with uploaded URLs. Returns {html, missing, changed}. */
async function processHtml(text, htmlPath, idx, folder){
  const frag = isFragment(text), doc = parseHtml(text);
  const cache = new Map(), missing = new Set(); let changed = false;
  async function resolve(u){
    if (!u) return null; const v = u.trim();
    if (/^data:image\//i.test(v) && v.length > 60000 && /;base64,/.test(v)) {
      if (!cache.has(v)) cache.set(v, uploadImageFile(dataUrlToBlob(v), folder)); return cache.get(v);
    }
    if (!isLocalRef(v)) return null;
    const f = findImage(v, htmlPath, idx);
    if (!f) { missing.add(baseName(normRef(v)) || v); return null; }
    if (!cache.has(f)) cache.set(f, uploadImageFile(f, folder));
    return cache.get(f);
  }
  for (const r of collectRefs(doc)) {
    if (r.kind === 'url') { const n = await resolve(r.value); if (n) { r.el.setAttribute(r.attr, n); changed = true; } }
    else if (r.kind === 'srcset') {
      const parts = r.value.split(/,\s+/); const out = [];
      for (const p of parts) { const [u, ...d] = p.trim().split(/\s+/); const n = await resolve(u); if (n) changed = true; out.push([n || u, ...d].join(' ')); }
      r.el.setAttribute(r.attr, out.join(', '));
    } else {
      let css = r.value;
      for (const m of [...r.value.matchAll(cssUrlRe)]) { const n = await resolve(m[2]); if (n) { css = css.split(m[0]).join(`url("${n}")`); changed = true; } }
      if (r.attr) r.el.setAttribute('style', css); else r.el.textContent = css;
    }
  }
  return { html: changed ? serialize(doc, frag) : text, missing:[...missing], changed };
}

/* ============================================================ preview frame (sandboxed, CSP-locked) */
// This function is stringified and runs INSIDE the sandboxed iframe (opaque origin).
function frameMain(init){
  const SKIP = new Set(['STYLE', 'SCRIPT', 'NOSCRIPT', 'TEMPLATE', 'TITLE', 'HEAD', 'TEXTAREA', 'OPTION', 'SELECT']);
  const post = m => parent.postMessage(Object.assign({ __rv:1 }, m), '*');

    const out = [];
    const w = document.createTreeWalker(root(), NodeFilter.SHOW_TEXT, { acceptNode(n){ for (let p = n.parentNode; p && p.nodeType === 1; p = p.parentNode) if (SKIP.has(p.tagName)) return NodeFilter.FILTER_REJECT; return NodeFilter.FILTER_ACCEPT; } });
    let n; while ((n = w.nextNode())) out.push(n); return out;
  }
  const fullText = () => texts().map(n => n.data).join('');
  function pointOffset(container, offset){
    const r = document.createRange(); r.setStart(root(), 0);
    try { r.setEnd(container, offset); } catch { return 0; }
    let acc = 0;
    for (const n of texts()) {
      if (n === r.endContainer) { acc += r.endOffset; break; }
      if (r.intersectsNode(n)) acc += n.data.length; else if (acc > 0) break;
    }
    return acc;
  }
  let editing = !!init.edit, comments = [], active = null;
  function onSel(){
    if (editing) return;
    const s = getSelection();
    if (!s || s.isCollapsed || !s.rangeCount) { post({ type:'selclear' }); return; }
    const r = s.getRangeAt(0);
    let a = pointOffset(r.startContainer, r.startOffset), b = pointOffset(r.endContainer, r.endOffset);
    const full = fullText(); let q = full.slice(a, b);
    a += q.length - q.trimStart().length; b -= q.length - q.trimEnd().length; q = full.slice(a, b);
    if (!q.trim()) { post({ type:'selclear' }); return; }
    const rc = r.getBoundingClientRect();
    post({ type:'sel', start:a, end:b, quote:q.slice(0, 3000), prefix:full.slice(Math.max(0, a - 40), a), suffix:full.slice(b, b + 40), rect:{ x:rc.left, y:rc.top, w:rc.width, h:rc.height } });
  }
  document.addEventListener('mouseup', () => setTimeout(onSel, 0));
  document.addEventListener('keyup', e => { if (e.shiftKey || e.key === 'Shift') setTimeout(onSel, 0); });
  document.addEventListener('touchend', () => setTimeout(onSel, 60));

  function commonPrefix(a, b){ let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++; return i; }

      const pre = full.slice(Math.max(0, idx - 40), idx), suf = full.slice(idx + c.quote.length, idx + c.quote.length + 40);
      const sc = commonSuffix(pre, c.prefix || '') + commonPrefix(suf, c.suffix || '') - Math.abs(idx - (c.start || 0)) / 1e7;

  }
  function clearMarks(){ document.querySelectorAll('mark.__rvh').forEach(m => m.replaceWith(...m.childNodes)); root().normalize(); }
  function wrap(start, end, id, cls){
    let acc = 0;
    for (const n of texts()) {
      const s = acc, e = acc + n.data.length; acc = e;
      if (e <= start) continue; if (s >= end) break;
      const a = Math.max(start, s) - s, b = Math.min(end, e) - s;

      let node = n; if (a > 0) node = node.splitText(a); if (b - a < node.data.length) node.splitText(b - a);

      node.parentNode.insertBefore(m, node); m.appendChild(node);
    }
  }
  function setActive(){ document.querySelectorAll('mark.__rvh').forEach(m => m.classList.toggle('__rvh-act', m.dataset.id === active)); }

    clearMarks(); const full = fullText(); const loc = {};
    for (const c of comments) loc[c.id] = locate(c, full);
    for (const c of comments) if (loc[c.id]) wrap(loc[c.id][0], loc[c.id][1], c.id, c.resolved ? '__rvh-res' : '');
    setActive(); post({ type:'located', loc });
  }

    if (e.source !== parent) return; const m = e.data || {};
    if (m.type === 'comments') { comments = m.items || []; render(); }
    else if (m.type === 'focus') { active = m.id; setActive(); const mk = document.querySelector(`mark.__rvh[data-id="${m.id}"]`); if (mk && m.scroll) mk.scrollIntoView({ behavior:'smooth', block:'center' }); }
    else if (m.type === 'edit') { editing = !!m.on; document.documentElement.classList.toggle('__rv-edit', editing); }
    else if (m.type === 'clearsel') { const s = getSelection(); s && s.removeAllRanges(); }
  });

    const tg = e.target instanceof Element ? e.target : e.target.parentElement; if (!tg) return;
    if (editing) {
      e.preventDefault(); e.stopPropagation();
      const img = tg.closest('img'); if (img && img.dataset.rvI) { post({ type:'img', i:+img.dataset.rvI }); return; }
      const blk = tg.closest('p,h1,h2,h3,h4,h5,h6,blockquote,figure,table,ul,ol,pre,details');
      post({ type:'block', i: blk && blk.dataset.rvI ? +blk.dataset.rvI : -1 }); return;
    }
    const mk = tg.closest('mark.__rvh'); const s = getSelection();

/* ============================================================ admin: upload */
async function entriesToFiles(items){
  const out = [];
  async function walk(entry, path){
    if (entry.isFile) { const f = await new Promise((res, rej) => entry.file(res, rej)); out.push({ file:f, path:path + f.name }); }
    else if (entry.isDirectory) {
      const reader = entry.createReader();
      for (;;) { const batch = await new Promise((res, rej) => reader.readEntries(res, rej)); if (!batch.length) break; for (const e of batch) await walk(e, path + entry.name + '/'); }
    }
  }
  const entries = [...items].map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  for (const e of entries) await walk(e, '');
  return out;
}
function uploadDialog({ targetDoc } = {}){
  let picked = []; // {file, path}
  const nameInp = h('input', { class:'inp', value: t('batchDefault', { d:today() }) });
  const fileInp = h('input', { type:'file', multiple:true, accept:'.html,.htm,image/*', class:'hidden' });
  const dirInp = h('input', { type:'file', multiple:true, webkitdirectory:true, class:'hidden' });
  const table = h('div'); const prog = h('div', { class:'progress hidden' }, h('div')); const status = h('div', { class:'mut', style:'margin-top:8px' });
  const drop = h('div', { class:'drop' }, h('div', { text:t('dropHere') }), h('div', { class:'btns' },
    h('button', { class:'btn', text:t('pickFiles'), onclick: () => fileInp.click() }),
    h('button', { class:'btn', text:t('pickFolder'), onclick: () => dirInp.click() })), fileInp, dirInp);
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', async e => { e.preventDefault(); drop.classList.remove('over'); const files = await entriesToFiles(e.dataTransfer.items); add(files.length ? files : [...e.dataTransfer.files].map(f => ({ file:f, path:f.name }))); });
  fileInp.addEventListener('change', () => { add([...fileInp.files].map(f => ({ file:f, path:f.name }))); fileInp.value = ''; });
  dirInp.addEventListener('change', () => { add([...dirInp.files].map(f => ({ file:f, path:f.webkitRelativePath || f.name }))); dirInp.value = ''; });
  const goBtn = h('button', { class:'btn primary', text:t('startUpload'), disabled:true, onclick: go });
  let plan = [];
  async function add(items){
    const seen = new Set(picked.map(p => p.path));
    for (const it of items) if (!seen.has(it.path) && (isHtmlName(it.path) || isImgName(it.path))) picked.push(it);
    await rebuild();
  }
  async function rebuild(){
    const htmls = picked.filter(p => isHtmlName(p.path)); const imgs = picked.filter(p => isImgName(p.path));
    const idx = makeImageIndex(imgs);
    const byName = new Map(); for (const d of [...S.docs].sort((a, b) => a.updated_at.localeCompare(b.updated_at))) byName.set(d.name.toLowerCase(), d);
    plan = [];
    const list = targetDoc ? htmls.slice(0, 1) : htmls;
    for (const hf of list) {
      const text = await hf.file.text(); const name = baseName(hf.path);
      const existing = targetDoc || byName.get(name.toLowerCase());
      plan.push({ hf, text, name, existing, scan:prescan(text, hf.path, idx) });
    }
    plan.sort((a, b) => natural(a.name, b.name));
    if (!plan.length) { table.replaceChildren(picked.length ? h('div', { class:'bad', style:'margin-top:10px', text:t('noHtml') }) : ''); goBtn.disabled = true; return; }
    table.replaceChildren(h('table', { class:'files' },
      h('tr', {}, h('th', { text:t('fileCol') }), h('th', { text:t('statusCol') }), h('th', { text:t('imgCol') })),
      plan.map(p => h('tr', {}, h('td', { text:p.name }),
        h('td', { class: p.existing ? '' : 'ok', text: p.existing ? t('isNewVersion', { v:p.existing.current_version + 1 }) : t('isNew') }),
        h('td', { class: p.scan.missing.length ? 'bad' : (p.scan.found ? 'ok' : 'mut'), title:p.scan.missing.join(', '),
          text: p.scan.missing.length ? t('imgsMissing', { a:p.scan.found, b:p.scan.missing.length }) + ': ' + p.scan.missing.slice(0, 3).join(', ') + (p.scan.missing.length > 3 ? '…' : '') : (p.scan.found ? t('imgsOk', { a:p.scan.found }) : t('imgsNone')) })))),
      imgs.length ? h('div', { class:'mut', style:'margin-top:6px;font-size:12px', text:t('imgCount', { n:imgs.length }) }) : null);
    goBtn.disabled = false;
  }
  async function go(){
    goBtn.disabled = true; prog.classList.remove('hidden');
    const idx = makeImageIndex(picked.filter(p => isImgName(p.path)));
    let batch = null, nNew = 0, nUpd = 0, firstId = null;
    try {
      for (let i = 0; i < plan.length; i++) {
        const p = plan[i]; status.textContent = t('uploading', { i:i + 1, n:plan.length }) + ' ' + p.name;
        prog.firstChild.style.width = `${(i / plan.length) * 100}%`;
        let doc = p.existing, version;
        if (doc) version = doc.current_version + 1;
        else { if (!batch) batch = await api.createBatch(nameInp.value.trim() || t('batchDefault', { d:today() })); doc = await api.createDoc({ batch_id:batch.id, name:p.name }); version = 1; }
        try {
          const r = await processHtml(p.text, p.hf.path, idx, `${doc.batch_id}/${doc.id}`);
          await api.addVersion(doc.id, version, r.html, version === 1 ? null : (LANG === 'zh' ? '重新上传' : 'Re-uploaded'), r.missing);
        } catch (e) { if (version === 1) await api.deleteDoc(doc).catch(() => {}); throw e; }
        if (version === 1) nNew++; else nUpd++;
        firstId ||= doc.id;
      }
      prog.firstChild.style.width = '100%'; status.textContent = t('uploadDone', { a:nNew, b:nUpd }); toast(status.textContent);
      await loadLists(); m.close(); if (firstId) await openDoc(firstId); else renderAll();
    } catch (e) { fail(e); goBtn.disabled = false; await loadLists().catch(() => {}); renderSidebar(); }
  }
  const body = h('div', {}, !targetDoc && h('div', { class:'field' }, h('label', { text:t('batchName') }), nameInp), drop, table, prog, status);
  const m = modal(targetDoc ? `${t('newVersion')} · ${targetDoc.name}` : t('uploadTitle'), body, [h('button', { class:'btn', text:t('close'), onclick: () => m.close() }), goBtn], 'wide');
}

/* ============================================================ modal helpers */
function modal(title, body, buttons, size, onClose){
  const ov = h('div', { class:'overlay' });
  let closed = false;
  const close = () => { if (closed) return; closed = true; ov.remove(); document.removeEventListener('keydown', onKey); onClose && onClose(); };
  const onKey = e => { if (e.key === 'Escape') close(); };
  ov.append(h('div', { class:'modal' + (size ? ' ' + size : '') }, h('div', { class:'modal-h', text:title }), h('div', { class:'modal-b' }, body), h('div', { class:'modal-f' }, buttons)));
  ov.addEventListener('mousedown', e => { if (e.target === ov) close(); });
  document.addEventListener('keydown', onKey); document.body.append(ov);
  return { close, el:ov };
}
function confirmDialog(msg, { danger, requireText } = {}){
  return new Promise(res => {
    let result = false;
    const inp = requireText ? h('input', { class:'inp', style:'margin-top:10px', placeholder:requireText, onkeydown: e => { if (e.key === 'Enter' && !okBtn.disabled) okBtn.click(); } }) : null;
    const okBtn = h('button', { class:'btn ' + (danger ? 'solid-danger' : 'primary'), text:t('ok'), disabled: !!requireText, onclick: () => { result = true; m.close(); } });
    inp && inp.addEventListener('input', () => okBtn.disabled = inp.value.trim() !== requireText);
    const m = modal('', h('div', {}, h('div', { text:msg }), inp), [h('button', { class:'btn', text:t('cancel'), onclick: () => m.close() }), okBtn], null, () => res(result));
    m.el.querySelector('.modal-h').remove();
    setTimeout(() => (inp || okBtn).focus(), 20);
  });
}
function inputDialog(title, value){

    let out = null;

}

/* ============================================================ boot */
async function boot(){
  // 没填 CONFIG 时自动进入演示模式（数据只存在当前浏览器）
  const demo = new URLSearchParams(location.search).has('demo') || !CONFIG.SUPABASE_URL || !CONFIG.SUPABASE_KEY;
  if (demo) api = demoApi();
  else {
    const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
    api = supabaseApi(createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY));
  }
  S.token = localStorage.getItem('rv_token');
  if (!S.token) { S.token = uid() + uid(); localStorage.setItem('rv_token', S.token); }
  S.myHash = await sha256hex(S.token);
  try { S.admin = await api.isAdmin(); await loadLists(); } catch (e) { fail(e); }
  renderAll();
  const m = location.hash.match(/d=([\w-]+)/);
  const start = (m && S.docs.find(d => d.id === m[1])) ? m[1] : null;
  if (start) await openDoc(start);
  else if (S.docs.length) {
    const b = S.batches.find(b => S.docs.some(d => d.batch_id === b.id));
    const first = S.docs.filter(d => d.batch_id === b?.id).sort((x, y) => natural(x.name, y.name))[0];
    if (first) await openDoc(first.id);
  }
  let timer;
  api.subscribe(table => {
    clearTimeout(timer);
    timer = setTimeout(async () => {
      try {
        if (table === 'comments') { if (S.docId) { await loadComments(); sendComments(); renderPanel(); } await refreshStats(); }
        else { await loadLists(); renderHeader(); renderSidebar(); if (S.docId && !curDoc()) { S.docId = null; renderAll(); } }
      } catch (e) { console.warn(e); }
    }, 400);
  });
}
boot();
