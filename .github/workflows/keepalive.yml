# 每 3 天访问一次 Supabase，防止免费项目因 7 天无访问被暂停。
# 同时会给这个定时任务"续期"，避免 GitHub 在仓库 60 天无改动时停用它。
name: keep-supabase-awake

on:
  schedule:
    - cron: "17 3 */3 * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oP "SUPABASE_URL:\s*'\K[^']+" index.html)
          KEY=$(grep -oP "SUPABASE_KEY:\s*'\K[^']+" index.html)
          if [ -z "$URL" ] || [ -z "$KEY" ]; then echo "CONFIG not filled yet, skip"; exit 0; fi
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/batches?select=id&limit=1" -H "apikey: $KEY")
          echo "Supabase responded HTTP $code"
          test "$code" = "200"
      - name: Keep this schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable" || true
